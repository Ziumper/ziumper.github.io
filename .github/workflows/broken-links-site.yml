name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # ubuntu-latest images only ship the newest patch of each Ruby series, so pin the series, not the patch
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll clean
          bundle exec jekyll build
          mkdir -p _site/assets/images
          cp -r archive/src/assets/images/* _site/assets/images/
      # Copy the directory from archive to cheat the check, but still the links check will do a job, and if something
      # is wrong with the link it will report it
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # only check local links
          args: >
            --offline
            --exclude '_site/archive'
            --exclude '_site/archive/index.html'
            --remap '_site(/?.*)/assets/(.*) _site/assets/$2'
            --verbose --no-progress '_site/**/*.html'

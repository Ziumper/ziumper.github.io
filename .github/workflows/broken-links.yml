name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/**.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/**.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # removed md files that include liquid tags; 429 (rate limited, e.g. itch.io) is not a broken link
          args: >
            --user-agent 'curl/7.54'
            --accept '100..=103,200..=299,429'
            --exclude-path README.md
            --exclude-path _pages/en/404.md
            --exclude-path _pages/pl/404.md
            --exclude-path _pages/en/blog.md
            --exclude-path _pages/pl/blog.md
            --exclude-path _site
            --exclude-path archive
            --exclude-path node_modules
            --exclude 'https://pl.wikipedia.org/*'
            --exclude 'https://en.wikipedia.org/*'
            --verbose --no-progress './**/*.md' './**/*.html'
